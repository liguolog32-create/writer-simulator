# 作家模拟器 · Cloudflare 基建配置
# 说明：资源命名沿用现有线上基建（Pages: writer-simulator / Worker: writer-sim-llm），
# 不按 PRD 文档改名，避免域名变更与权限重配。PRD 描述的产品架构（KV + D1 + 定时备份）在此落地。
name = "writer-sim-llm"
main = "worker.js"
compatibility_date = "2024-09-01"

# KV：项目画布、原子设定、快照、分支、权重配置、应用状态
[[kv_namespaces]]
binding = "WRITER_KV"
id = "6cfed67b1aab40e78ff8062358ec5c3f"

# KV（v10.64 新增）：**用户作品库专用储存库** —— 与「应用状态」物理隔离。
# 目的：网页/Worker 版本更新、甚至前端回写逻辑出 bug 时，用户的作品库都不会被清掉。
# 存法：user:<uid>:library:v1（当前全量作品库）+ user:<uid>:library:snap:<stamp>（历史版本，保留最近 N 份）
[[kv_namespaces]]
binding = "WRITER_ASSETS"
id = "bdd75b97716a425186e1d4bef314d6ca"

# D1：项目元信息、权重变更日志、案例库、章节索引、备份执行日志
[[d1_databases]]
binding = "WRITER_D1"
database_name = "ai_writer_d1_db"
database_id = "196ff6af-eb8b-4978-81f1-c23fca3325ac"

# Workers AI：免费引擎（不消耗 DeepSeek token 的写作通道）
# 每天赠送 10,000 神经元（约 $0.11，UTC 0 点重置），免费池可用中文模型：
#   @cf/zai-org/glm-4.7-flash   智谱，131k 上下文 → 约 27 万输出 token/天
#   @cf/qwen/qwen3-30b-a3b-fp8  阿里 MoE，32k 上下文
# 注意：deepseek-v4-flash-0731 / kimi-k2.6 / glm-5.2 等「前沿模型」必须
# Workers Paid 或 AI Gateway 预付额度，免费额度调不动，别写进免费通道。
[ai]
binding = "AI"

# Cron：每日 02:00 UTC（北京时间 10:00）全量备份
[triggers]
crons = ["0 2 * * *"]

# R2 备份桶：需先在 Cloudflare Dashboard 开通 R2（错误码 10042），开通后取消注释并重新部署
# [[r2_buckets]]
# binding = "WRITER_BACKUP"
# bucket_name = "ai-writer-backup-bucket"
